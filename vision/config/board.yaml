# Jetson Nano B01 档：等 TF 卡到了，把这份拷上去，改 ws_url 就能跑
# 用法：python3 scripts/vision_sim.py --profile board --no-window
#
# 和 sim 的差别只有三处：
#   1. 摄像头后端 auto（Linux → V4L2）
#   2. 关掉镜像、关窗口（板子上没有可靠 HDMI，见 memory/02）
#   3. ws_url 指向鲁班猫5 的实际 IP（以现场 nmcli 查到的为准，别抄规划值）

camera:
  source: 0
  # 必须写 v4l2，不能留 auto：这个 L4T OpenCV 4.1.1 的 CAP_ANY 会先试 GStreamer
  # 后端，GStreamer 管线既不认 FOURCC 也不认 BUFFERSIZE（2026-11-07 板端实测：
  # backend=auto + FOURCC=MJPG 时 50 帧连续读不到；同参数 backend=v4l2 正常）。
  backend: v4l2
  width: 1280
  height: 720
  # 2026-11-07 板端实测（同一台 UVC，USB2）：不写 fourcc 时 V4L2 会把 1280x720
  # 协商成 YUYV，采集只有 9.9 fps，整条管线 6.2 fps；显式 MJPG + 30 后
  # 采集 49.6 fps、管线 18.7 fps（单帧推理 25.9 ms、帧→返回中位 44 ms）。
  # 相机标称 60 fps，但 USB2 带宽撑不住（40 帧里偶发截断 JPEG），所以钉 30。
  fourcc: MJPG
  fps: 30
  mirror: false
  warmup_frames: 5

detection:
  # 帧级均匀保护（2026-11-07 加）：板上实测纯黑帧 YuNet(2022) 输出
  # score=0.8862、bbox=[50,-7,1144,746]（比画面还高，overlap 分支输出 1.0688），
  # 暗帧(值 16) 也有 0.6732 —— 都会过 0.6 门限误报陌生人。摄像头被遮、夜间无红外、
  # 视频流掉线都属于这种情况。判据是缩小到 160 宽后的灰度标准差：
  # 全黑/暗帧 = 0，真实素材帧（8 条 1080p）最低 20+，所以 2.0 不会误伤。
  # CPU dnn 与 TensorRT 输出一致，不是 engine 问题；证据
  # docs/data/detector-black-frame-fp-2026-11-07.json。写 0 = 关闭（恢复老行为）。
  blank_std: 2.0

server:
  enabled: true
  ws_url: ws://192.168.5.11:8765    # 鲁班猫的视觉入站口（2026-11-11 双板打通后实测地址）
  heartbeat_sec: 5.0
  reconnect_sec: 3.0
  # 事件出口必须"断了也不拖主循环"：对端 accept 了但不应答时握手读会挂死，
  # 对端不读时 sendall 也会挂死（实测同段视频 16.5 → 8.2 fps）。
  # 1.0 / 0.5 秒是局域网发一条 <2 KB 事件的宽松上限；连不上按 3→6→12s 退避。
  timeout: 1.0
  send_timeout: 0.5
  max_reconnect_sec: 60.0

output:
  save_snapshots: true
  # 存图后推到鲁班猫主人端（设计 §5）：照片按事件 msg_id 绑定，看板/APK 才有图。
  # 密钥不进仓库 → 板上 export SENTINEL_VISION_KEY=<与 master.local.yaml 一致的 vision_key>
  # 没设密钥时服务照常上报事件，只是推图关闭（启动日志会明说）。
  snapshot_push:
    enabled: true
    url: http://192.168.5.11:8766/vision/snapshot
    key: ""
    timeout: 2.0
    queue_size: 8

recognition:
  # 板上 SFace 的 ONNX 原件（engine 的 sidecar 绑的就是这个文件的哈希）。
  # CPU 兜底时 dnn 直接用它；识别一次只喂 1 张，动态 batch 模型也能吃。
  model: /home/jetson/sentinel-quality-20261106/sface_dynamic_batch.onnx

# 两层去重的第 2 层：匿名会话关联（2026-11-07 接线，板上实测后开的）
# 合同：docs/跨轨关联与两层去重合同-2026-11-01.md（证据充分且唯一才复用会话）
association:
  enabled: true
  # tau/margin 沿用离线研究（LFW 500 异对 FAR=0）；板上真素材复测：同类余弦
  # min 0.461 / median 0.846，异类 max 0.330，两个阈值都有余量。
  tau: 0.45
  margin: 0.10
  # 质量门要重标定：离线研究的 0.10 是按 1:1 关键点精度算的，板上 YuNet 输入固定
  # 320×320，5 个点被量化到 ~2.4 px 一格再放大回 768 宽，残差整体被抬高约 1.5×。
  # 板上实测（40 帧 79 张脸）：rms_norm p10 0.111 / median 0.145 / p90 0.287。
  # 取 0.16：入册率 2.5%→58%，此时异类余弦上界仍只有 0.209（< tau-0.24）。
  # 证据 docs/data/quality-gate-2026-11-07.json。
  quality_max_rms: 0.16
  session_ttl_sec: 120.0     # 2 分钟内的再次出现算同一次在场
  track_ttl_sec: 2.0
  # 2026-11-08 真素材复评（docs/真实素材关联复评-2026-11-08.md）新增两项：
  # 弱证据连续 weak_obs 帧才建会话（单帧侧脸残影不再拆出重复会话）；
  # 上报要求该轨道至少一帧过质量门（出画/转身残影不算新访客）。
  weak_obs: 2
  require_quality_evidence: true
  # 现挂会话首报延迟（2026-11-09）：会话建出来先挂起，撑够 K 帧或 K 毫秒（先到者）
  # 才真发 —— 压掉出画那一两帧的"干净正面残影"（余弦 0.29–0.38、rms 0.07–0.12，
  # weak_obs 与质量门都拦不住）。板上 17 fps 时首次上报约晚 0.18 s。
  # 真素材 8 条实测：关 6/8、开 7/8。弱证据建出的会话要攒更久。
  first_report_confirm_frames: 3
  first_report_confirm_ms: 1000
  weak_first_report_confirm_frames: 6

runtime:
  max_fps: 0             # 板端要真实耗时基线，不人为限帧
  headless: true
  # 板上 OpenCV 4.1.1 没有 cv2.FaceDetectorYN / FaceRecognizerSF，旧路径只能走 Haar
  # （没有关键点 → 只能报陌生人）。这里切到裸 ONNX 管线：YuNet + 五点对齐 + SFace。
  # auto = engine 可用走 TensorRT，不可用退 CPU dnn；两边都会打日志。
  backend: auto
  detector_engine: /home/jetson/sentinel-quality-20261106/yunet_fp16.engine
  recognizer_engine: /home/jetson/sentinel-quality-20261106/sface_batch_fp16.engine
  # 以下三项按本板 2026-11-07 实际情况改写：
  #   - engine 与 TensorRT 版本/设备绑定，换板或升级 JetPack 必须用
  #     logs/video-validation/trt_regression.py 重建（sidecar 会主动拦下版本漂移）
  #   - 320 声明的 YuNet 副本（4.1.1 能导入；2023mar 原件不能）
  detector_onnx: /home/jetson/sentinel-quality-20261106/yunet_trt320.onnx
