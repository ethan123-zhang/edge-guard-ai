# 视觉节点公共配置（docs/02 §7.1）
# 只写"值得被人看见"的阈值；其余键在 vision/config.py 的 DEFAULTS 里有默认值。
# 现场要调的东西：score_threshold / match_threshold / min_face_px / roi。

profile: sim

camera:
  source: 0
  backend: auto          # Windows 仿真用 dshow；板端 auto → v4l2
  width: 1280
  height: 720
  fourcc: ""             # 采集格式；板端 USB2 摄像头写 MJPG（空=UVC 默认，720p 会退 YUYV）
  fps: 0                 # 0=不指定；板端写 30（相机标称 60，USB2 撑不住）
  mirror: false
  warmup_frames: 3

roi:
  # 门口场景：只处理画面中间那条竖带，避免走廊里路过的人触发
  enabled: false
  x: 0.30
  y: 0.15
  w: 0.40
  h: 0.70

detection:
  backend: auto          # 有 YuNet 模型就用 yunet，否则自动退 haar
  model: models/face_detection_yunet_2023mar.onnx
  score_threshold: 0.6
  nms_threshold: 0.3
  min_face_px: 80
  haar_min_neighbors: 5
  # 帧级均匀保护：灰度标准差低于此值 = 镜头被遮/全黑/流掉线，跳过检测。
  # 近黑帧会让 YuNet 吐高置信假脸（板端实测 score 0.886、框比画面还大），
  # 真实素材帧标准差最低 20+，2.0 不会误伤。0 = 关闭。
  blank_std: 2.0

recognition:
  backend: auto          # 有 SFace 模型就用 sface，否则自动退 none（全部当陌生人）
  model: models/face_recognition_sface_2021dec.onnx
  match_threshold: 0.363
  gallery_dir: face_db
  confirm_frames: 3
  cooldown_sec: 10.0
  track_ttl_sec: 2.0

association:
  # 短期匿名关联层：默认关闭。打开前必须过独立场景素材验收（换人/相邻/恢复/歧义）。
  enabled: false
  tau: 0.45              # 本方相似度阈值
  margin: 0.10           # 本方 - 异方 最小边距
  quality_max_rms: 0.10  # 入册质量门（对齐残差 ÷ 眼距）

server:
  enabled: true
  heartbeat_sec: 5.0
  reconnect_sec: 3.0
  # 对端 accept 了但不应答时，握手读会一直挂着；sendall 在对端不读时也会卡住。
  # 两个超时都必须有界，否则网络一断主循环就被拖死（实测 16.5→8.2 fps）。
  timeout: 1.0
  send_timeout: 0.5
  # 连不上时 3s → 6s → 12s… 退避到这个上限再探测（"半死"对端不会每 3 秒拖一秒）
  max_reconnect_sec: 60.0
  # ws_url 由 profile 决定（sim 指本机回环，board 指鲁班猫5 的地址）

output:
  snapshot_dir: snapshots
  save_snapshots: true
  snapshot_quality: 90
  print_events: true

runtime:
  max_fps: 0
  duration_sec: 0
  headless: false
  log_level: info
  # 检测/识别后端（2026-11-07 P1）。板上没有 cv2.FaceDetectorYN，只有
  # cpu/auto/trt 这三条「裸 ONNX」路径能用 YuNet + 五点对齐 + SFace：
  #   legacy = 旧路径（FaceDetectorYN / Haar），默认不变
  #   auto   = 检测、识别各自判断：engine 可用走 TensorRT，否则退 CPU dnn
  #   cpu    = 强制 CPU dnn（不碰 TensorRT）
  #   trt    = 强制 TensorRT，engine 不可用直接报错，绝不静默降级
  backend: legacy
  detector_onnx: models/yunet_2022_opset9_experiment.onnx   # 320 声明版，4.1.1 也能导入
  detector_engine: ""        # 空=没有 engine；相对路径按 vision/ 解析
  recognizer_engine: ""
  recognizer_batch: 8        # SFace engine 的 profile 上限就是 8
  warmup: true
